name: Mobile release builds

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generate app icons and splash screens
        run: npx capacitor-assets generate --android || true

      - name: Apply version from tag
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          VERSION="$(echo "$TAG" | sed 's/^v//')"
          case "$VERSION" in
            [0-9]*) ;;
            *) VERSION="1.0.0" ;;
          esac
          CODE="${GITHUB_RUN_NUMBER:-1}"
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode .*/versionCode $CODE/" android/app/build.gradle
          grep -nE "versionName|versionCode" android/app/build.gradle

      - name: Prepare signing keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "official=true" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret - generating a throwaway key so the APK is still installable."
            keytool -genkeypair -v -keystore android/app/release.keystore \
              -alias ctttradezone -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ctttradezone -keypass ctttradezone \
              -dname "CN=ctttradezone, OU=Mobile, O=CTT Trade Zone, L=Lagos, C=NG"
            echo "official=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release (APK + AAB)
        working-directory: android
        env:
          OFFICIAL: ${{ steps.keystore.outputs.official }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$OFFICIAL" = "true" ]; then
            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"; ALIAS="$ANDROID_KEY_ALIAS"; KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            STORE_PASS="ctttradezone"; ALIAS="ctttradezone"; KEY_PASS="ctttradezone"
          fi
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          TAG="${GITHUB_REF_NAME:-manual}"
          find android/app/build/outputs -name "*.apk" -exec cp {} "artifacts/ctttradezone-$TAG-sideload.apk" \; || true
          find android/app/build/outputs -name "*.aab" -exec cp {} "artifacts/ctttradezone-$TAG-play.aab" \; || true
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: artifacts/*
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*

  ios:
    name: iOS (archive / IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Add iOS platform
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Generate app icons and splash screens
        run: npx capacitor-assets generate --ios || true

      - name: Apply version from tag
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          VERSION="$(echo "$TAG" | sed 's/^v//')"
          case "$VERSION" in
            [0-9]*) ;;
            *) VERSION="1.0.0" ;;
          esac
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER:-1}" "$PLIST" || true

      - name: Install CocoaPods dependencies (only when a Podfile exists)
        working-directory: ios/App
        run: |
          if [ -f Podfile ]; then
            pod install
          else
            echo "No Podfile - Capacitor 8 uses Swift Package Manager, skipping."
          fi

      - name: Resolve Xcode container flag
        id: xcflag
        working-directory: ios/App
        run: |
          if [ -d App.xcworkspace ]; then
            echo "flag=-workspace App.xcworkspace" >> "$GITHUB_OUTPUT"
          else
            echo "flag=-project App.xcodeproj" >> "$GITHUB_OUTPUT"
          fi


      - name: Import signing assets
        id: signing
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_CERTIFICATE_P12_BASE64" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "No Apple signing secrets - producing an unsigned archive and unsigned IPA."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 -d > /tmp/cert.p12
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > /tmp/profile.mobileprovision
          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Archive (signed) and export IPA
        if: steps.signing.outputs.signed == 'true'
        working-directory: ios/App
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild ${{ steps.xcflag.outputs.flag }} -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Archive (unsigned)
        if: steps.signing.outputs.signed == 'false'
        working-directory: ios/App
        run: |
          xcodebuild ${{ steps.xcflag.outputs.flag }} -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive

      - name: Package unsigned IPA (sideloadable)
        if: steps.signing.outputs.signed == 'false'
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -1)"
          if [ -n "$APP_PATH" ]; then
            mkdir -p "$RUNNER_TEMP/ipa/Payload"
            cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
            (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/App-unsigned.ipa" Payload)
          fi

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          TAG="${GITHUB_REF_NAME:-manual}"
          if ls "$RUNNER_TEMP/export"/*.ipa >/dev/null 2>&1; then
            cp "$RUNNER_TEMP/export"/*.ipa "artifacts/ctttradezone-$TAG.ipa"
          fi
          if [ -f "$RUNNER_TEMP/App-unsigned.ipa" ]; then
            cp "$RUNNER_TEMP/App-unsigned.ipa" "artifacts/ctttradezone-$TAG-unsigned.ipa"
          fi
          if [ -d "$RUNNER_TEMP/App.xcarchive" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/App.xcarchive" "artifacts/ctttradezone-$TAG.xcarchive.zip"
          fi
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ios-builds
          path: artifacts/*
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*

  windows:
    name: Windows (portable desktop app)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web bundle (relative asset paths)
        shell: bash
        env:
          ELECTRON_BUILD: "1"
        run: npm run build

      - name: Package Windows desktop app
        shell: bash
        run: |
          npx @electron/packager . ctttradezone \
            --platform=win32 --arch=x64 \
            --out=electron-release --overwrite \
            --ignore='^/src' --ignore='^/public' \
            --ignore='^/android' --ignore='^/ios' \
            --ignore='^/electron-release'
          ls -la electron-release

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          TAG="${GITHUB_REF_NAME:-manual}"
          DIR="$(ls -d electron-release/* | head -1)"
          (cd "$(dirname "$DIR")" && 7z a -tzip "../artifacts/ctttradezone-$TAG-windows-x64.zip" "$(basename "$DIR")")
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: artifacts/*
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
